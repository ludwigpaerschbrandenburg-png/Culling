[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fotosort"
dynamic = ["version"]
description = "Sortiert Fotos und Videos nach Aufnahmedatum und Kamera"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

# docs/architektur.md Abschnitt 3: bewusst wenige Abhaengigkeiten.
# tzdata steht ohne jede Bedingung hier, insbesondere nicht mit
# platform_system == "Windows" -- schlanke Container-Images bringen
# oft keine Zeitzonendatenbank mit.
dependencies = [
    "blake3",
    "rich",
    "tomli-w",
    "tzdata",
    # Oberflaeche (Phase 7): Server fuer die Seite, Fenster
    "fastapi",
    "uvicorn",
    "pywebview",
]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[project.scripts]
fotosort = "fotosort.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fotosort.oberflaeche" = ["static/*", "static/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "fotosort.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

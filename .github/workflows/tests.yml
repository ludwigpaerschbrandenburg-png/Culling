name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Ein neuer Push bricht den noch laufenden Lauf desselben Zweigs ab.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: ExifTool und Qt-Grundlagen installieren (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libimage-exiftool-perl libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          exiftool -ver

      - name: ExifTool installieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install exiftool -y --no-progress
          exiftool -ver

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" pytest-timeout

      - name: Tests
        # Haengt ein Test, bricht er nach 5 Minuten mit Stapelabzug ab,
        # statt den Lauf stundenlang zu blockieren. Das Qt-Fenster laeuft ohne Anzeige.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -p no:cacheprovider --timeout=300 -o faulthandler_timeout=290
